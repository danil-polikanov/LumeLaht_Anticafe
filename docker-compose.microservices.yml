services:
  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    ports:
      - "3000:80"
    volumes:
      - ./frontend/nginx.microservices.conf:/etc/nginx/conf.d/default.conf
    depends_on:
      api-gateway:
        condition: service_started
    deploy:
      resources:
        limits:
          cpus: "1"
          memory: 512M
    networks:
      - microservices-net

  api-gateway:
    build:
      context: ./Microservices/ApiGateway
      dockerfile: Dockerfile
    environment:
      - ASPNETCORE_ENVIRONMENT=Production
      - ASPNETCORE_URLS=http://+:8080
    depends_on:
      room-service:
        condition: service_started
      user-service:
        condition: service_started
      booking-service:
        condition: service_started
    deploy:
      resources:
        limits:
          cpus: "1"
          memory: 512M
    networks:
      - microservices-net

  room-service:
    build:
      context: ./Microservices/RoomService
      dockerfile: Dockerfile
    environment:
      - ASPNETCORE_ENVIRONMENT=Production
      - ASPNETCORE_URLS=http://+:8080
      - ConnectionStrings__DefaultConnection=Server=room-db;Database=LumeLaht_RoomDb;User Id=sa;Password=LumeLaht_Pass123!;TrustServerCertificate=True
    depends_on:
      room-db:
        condition: service_healthy
    deploy:
      resources:
        limits:
          cpus: "1"
          memory: 512M
    networks:
      - microservices-net

  user-service:
    build:
      context: ./Microservices/UserService
      dockerfile: Dockerfile
    environment:
      - ASPNETCORE_ENVIRONMENT=Production
      - ASPNETCORE_URLS=http://+:8080
      - ConnectionStrings__DefaultConnection=Server=user-db;Database=LumeLaht_UserDb;User Id=sa;Password=LumeLaht_Pass123!;TrustServerCertificate=True
      - Jwt__SecretKey=LumeLaht-Anticafe-Super-Secret-Key-For-JWT-2026!
      - Jwt__Issuer=LumeLaht
      - Jwt__Audience=LumeLaht-Client
      - Jwt__ExpirationMinutes=60
    depends_on:
      user-db:
        condition: service_healthy
    deploy:
      resources:
        limits:
          cpus: "1"
          memory: 512M
    networks:
      - microservices-net

  booking-service:
    build:
      context: ./Microservices/BookingService
      dockerfile: Dockerfile
    environment:
      - ASPNETCORE_ENVIRONMENT=Production
      - ASPNETCORE_URLS=http://+:8080
      - ConnectionStrings__DefaultConnection=Server=booking-db;Database=LumeLaht_BookingDb;User Id=sa;Password=LumeLaht_Pass123!;TrustServerCertificate=True
      - Jwt__SecretKey=LumeLaht-Anticafe-Super-Secret-Key-For-JWT-2026!
      - Jwt__Issuer=LumeLaht
      - Jwt__Audience=LumeLaht-Client
      - Jwt__ExpirationMinutes=60
      - ServiceUrls__RoomService=http://room-service:8080
    depends_on:
      booking-db:
        condition: service_healthy
      room-service:
        condition: service_started
    deploy:
      resources:
        limits:
          cpus: "1"
          memory: 512M
    networks:
      - microservices-net

  room-db:
    image: mcr.microsoft.com/mssql/server:2022-latest
    environment:
      - ACCEPT_EULA=Y
      - MSSQL_SA_PASSWORD=LumeLaht_Pass123!
    volumes:
      - room-db-data:/var/opt/mssql
    healthcheck:
      test: /opt/mssql-tools18/bin/sqlcmd -S localhost -U sa -P "LumeLaht_Pass123!" -C -Q "SELECT 1" || exit 1
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 30s
    deploy:
      resources:
        limits:
          cpus: "2"
          memory: 2G
    networks:
      - microservices-net

  user-db:
    image: mcr.microsoft.com/mssql/server:2022-latest
    environment:
      - ACCEPT_EULA=Y
      - MSSQL_SA_PASSWORD=LumeLaht_Pass123!
    volumes:
      - user-db-data:/var/opt/mssql
    healthcheck:
      test: /opt/mssql-tools18/bin/sqlcmd -S localhost -U sa -P "LumeLaht_Pass123!" -C -Q "SELECT 1" || exit 1
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 30s
    deploy:
      resources:
        limits:
          cpus: "2"
          memory: 2G
    networks:
      - microservices-net

  booking-db:
    image: mcr.microsoft.com/mssql/server:2022-latest
    environment:
      - ACCEPT_EULA=Y
      - MSSQL_SA_PASSWORD=LumeLaht_Pass123!
    volumes:
      - booking-db-data:/var/opt/mssql
    healthcheck:
      test: /opt/mssql-tools18/bin/sqlcmd -S localhost -U sa -P "LumeLaht_Pass123!" -C -Q "SELECT 1" || exit 1
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 30s
    deploy:
      resources:
        limits:
          cpus: "2"
          memory: 2G
    networks:
      - microservices-net

  prometheus:
    image: prom/prometheus:latest
    ports:
      - "9090:9090"
    volumes:
      - ./prometheus/prometheus.microservices.yml:/etc/prometheus/prometheus.yml
    depends_on:
      - room-service
      - user-service
      - booking-service
    networks:
      - microservices-net

  grafana:
    image: grafana/grafana:latest
    ports:
      - "3001:3000"
    environment:
      - GF_SECURITY_ADMIN_USER=admin
      - GF_SECURITY_ADMIN_PASSWORD=admin
      - GF_AUTH_ANONYMOUS_ENABLED=true
      - GF_AUTH_ANONYMOUS_ORG_ROLE=Viewer
    volumes:
      - grafana-microservices-data:/var/lib/grafana
    depends_on:
      - prometheus
    networks:
      - microservices-net

networks:
  microservices-net:
    driver: bridge

volumes:
  room-db-data:
  user-db-data:
  booking-db-data:
  grafana-microservices-data:
