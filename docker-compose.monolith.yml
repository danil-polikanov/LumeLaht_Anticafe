services:
  app:
    build:
      context: .
      dockerfile: LumeLaht_Anticafe/Dockerfile
    ports:
      - "3000:8080"
    environment:
      - ASPNETCORE_ENVIRONMENT=Production
      - ASPNETCORE_URLS=http://+:8080
      - ConnectionStrings__DefaultConnection=Server=db;Database=LumeLaht_Monolith;User Id=sa;Password=LumeLaht_Pass123!;TrustServerCertificate=True
      - Jwt__SecretKey=LumeLaht-Anticafe-Super-Secret-Key-For-JWT-2026!
      - Jwt__Issuer=LumeLaht
      - Jwt__Audience=LumeLaht-Client
      - Jwt__ExpirationMinutes=60
    depends_on:
      db:
        condition: service_healthy
    deploy:
      resources:
        limits:
          cpus: "4"
          memory: 2G
    networks:
      - monolith-net

  db:
    image: mcr.microsoft.com/mssql/server:2022-latest
    environment:
      - ACCEPT_EULA=Y
      - MSSQL_SA_PASSWORD=LumeLaht_Pass123!
    volumes:
      - monolith-db-data:/var/opt/mssql
    healthcheck:
      test: /opt/mssql-tools18/bin/sqlcmd -S localhost -U sa -P "LumeLaht_Pass123!" -C -Q "SELECT 1" || exit 1
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 30s
    deploy:
      resources:
        limits:
          cpus: "2"
          memory: 2G
    networks:
      - monolith-net

  prometheus:
    image: prom/prometheus:latest
    ports:
      - "9090:9090"
    volumes:
      - ./prometheus/prometheus.monolith.yml:/etc/prometheus/prometheus.yml
    depends_on:
      - app
    networks:
      - monolith-net

  grafana:
    image: grafana/grafana:latest
    ports:
      - "3001:3000"
    environment:
      - GF_SECURITY_ADMIN_USER=admin
      - GF_SECURITY_ADMIN_PASSWORD=admin
      - GF_AUTH_ANONYMOUS_ENABLED=true
      - GF_AUTH_ANONYMOUS_ORG_ROLE=Viewer
    volumes:
      - grafana-monolith-data:/var/lib/grafana
    depends_on:
      - prometheus
    networks:
      - monolith-net

networks:
  monolith-net:
    driver: bridge

volumes:
  monolith-db-data:
  grafana-monolith-data:
